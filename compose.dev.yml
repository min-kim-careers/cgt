    volumes:
      - ./web:/app
    networks:
      - web-network
      - gateway-network
      # - backend-network

  cgt_dev_gateway-service:
    container_name: cgt_dev_gateway-container
    image: nginx:latest
    restart: always
    ports:
      - 8081:8081
    environment:
      - HOST=192.168.8.103
      - PORT=8081
      - WEB_SERVICE=cgt_dev_web-service:5173
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - gateway-network

